[project]
name = "storebridge-mcp"
version = "2.0.0"
description = "Walk & Talk retail assistant: FastAPI, MCP, LangGraph, PostgreSQL"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1,<2",
    "langgraph>=0.6,<2",
    "langchain-openai>=0.3,<2",
    "langchain-google-genai>=2.1,<5",
    "langchain-mcp-adapters>=0.1.9,<1",
    "mcp>=1.12,<2",
    "pyjwt>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "langfuse>=3.0,<5",
    "ragas==0.4.4",
    "pandas>=3.1.1",
    "requests>=2.34.2",
    "openai>=2,<3",
    "ipykernel>=7.4.0",
    "pywin32>=312",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
